<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkClaw — AI 工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .tagline {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .feature {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .feature:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.25);
        }
        .emoji { font-size: 1.5rem; display: block; margin-bottom: 0.5rem; }
        footer {
            margin-top: 3rem;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 ArkClaw</h1>
        <p class="tagline">你的 AI 智能工作台 — 图片、视频、代码、创意，一站搞定</p>
        <div class="features">
            <div class="feature">
                <span class="emoji">🎨</span>
                <span>Seedream 图片生成</span>
            </div>
            <div class="feature">
                <span class="emoji">🎬</span>
                <span>Seedance 视频生成</span>
            </div>
            <div class="feature">
                <span class="emoji">🤖</span>
                <span>Ark Agent Plan</span>
            </div>
            <div class="feature">
                <span class="emoji">📝</span>
                <span>智能文档处理</span>
            </div>
            <div class="feature">
                <span class="emoji">🛠️</span>
                <span>自动化工作流</span>
            </div>
        </div>
        <footer>
            <p>Powered by Kimi K2.6 · Volcano Engine · GitHub Pages</p>
            <p>arkclaw.aigc.green</p>
        </footer>
    </div>
</body>
</html>
